# Runs the web app on the Oracle server, next to (and isolated from) the other project there.
# Lives in ~/ashby-web on that server; deploy.sh updates it. No ports are published: Cloudflare
# reaches the app through a Tunnel that cloudflared opens from the inside.
name: ashby-web

services:
  web:
    # No default: only sha tags are pushed, so a missing WEB_TAG should fail loudly, not pull "latest".
    image: ghcr.io/rishilahoti/ashby-job-scraper-web:${WEB_TAG:?WEB_TAG is set in .env by deploy.sh}
    restart: unless-stopped
    env_file: web.env
    depends_on:
      db:
        condition: service_healthy
    # Caps so a traffic spike can't starve the other project's API on this 2-CPU server: at most
    # one core, so the API always has the other.
    mem_limit: 1280m
    cpus: 1.0
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # /api/health runs SELECT 1, so a wrong DATABASE_URL shows up as unhealthy (and deploy.sh rolls back).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # The jobs database. No published port: web reaches it as db:5432 here, and the scraper, GitHub builds
  # and discover.yml come in through the tunnel (db.whatrunsindia.com -> tcp://db:5432, Access service
  # token only). The tunnel carries it encrypted, so no ssl. db.env holds POSTGRES_USER/PASSWORD/DB.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: db.env
    # 50 connections, as on the old server: web pool + scraper + a build's prerender fit.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    shm_size: 256m
    volumes:
      - jobs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Visitor analytics with a live "online" count. Reached only through the tunnel (stats.whatrunsindia.com -> http://umami:3000).
  # Secrets live in umami.env on the server (POSTGRES_DB/USER/PASSWORD, DATABASE_URL, APP_SECRET), not in git.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    env_file: umami.env
    depends_on:
      umami-db:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: umami.env
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  jobs-db-data:
  umami-db-data:
