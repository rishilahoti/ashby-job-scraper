name: Build and Push Scraper Image

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Build and load locally first (no push yet) so the Trivy scan below can
            # gate the actual push — a failed scan must never reach a tag Watchtower
            # polls and auto-deploys from.
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.REGISTRY }}/${{ github.repository }}-scraper:latest
                      ${{ env.REGISTRY }}/${{ github.repository }}-scraper:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Scan image for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-scraper:${{ github.sha }}
                  format: sarif
                  output: trivy-results.sarif
                  severity: CRITICAL,HIGH
                  exit-code: '1'

            - name: Upload scan results to the Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
              with:
                  sarif_file: trivy-results.sarif

            - name: Push image
              run: |
                  docker push ${{ env.REGISTRY }}/${{ github.repository }}-scraper:latest
                  docker push ${{ env.REGISTRY }}/${{ github.repository }}-scraper:${{ github.sha }}
