name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scraper:
    runs-on: ubuntu-latest
    services:
      # test/db.test.js runs real queries against the configured database — a
      # genuine ephemeral Postgres here, not a mock, so that test stays honest.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/ imports code from the repo-root src/ (e.g. src/normalize/shared.js
      # requires sanitize-html) — that's a root package.json dependency, not
      # web's, so it has to be installed separately. Same fix as vercel.json's
      # installCommand, just for this CI job's own `npm ci`.
      - run: npm ci --prefix ..

      # next-auth's peer range (^7.0.7 || ^8.0.5) is stale — nodemailer is only
      # used directly by our own custom email-OTP code (web/lib/mailer.ts), never
      # through next-auth's own Email provider, so overriding it is safe.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
        env:
          # Placeholder — no live DB needed for the build step itself. Pages that
          # query the DB gracefully fall back to empty/zero on a connection error
          # (see withStaleFallback in lib/query.ts), so a fake host is fine here.
          DATABASE_URL: "postgres://user:pass@localhost:5432/db"

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
