name: Discover Companies

on:
    schedule:
        - cron: '0 3 * * *' # daily, 03:00 UTC — Common Crawl snapshots refresh ~monthly, but
          # re-runs are cheap since already-tracked slugs are skipped, so daily just catches
          # newly-listed companies sooner.
    workflow_dispatch: # manual trigger button

permissions:
    contents: read

jobs:
    discover:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: Production
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
            - run: npm ci

            - name: Discover Ashby companies
              continue-on-error: true # one source failing shouldn't block the other
              run: node index.js discover --source ashby
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Greenhouse companies
              continue-on-error: true
              run: node index.js discover --source greenhouse
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Workable companies
              continue-on-error: true
              run: node index.js discover --source workable
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover SmartRecruiters companies
              continue-on-error: true
              run: node index.js discover --source smartrecruiters
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Recruitee companies
              continue-on-error: true
              run: node index.js discover --source recruitee
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Teamtailor companies
              continue-on-error: true
              run: node index.js discover --source teamtailor
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Pinpoint companies
              continue-on-error: true
              run: node index.js discover --source pinpoint
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            # Workday boards average ~90 jobs (capped at 200), so a few hundred of
            # them would double the jobs table on the 1 GB VM. 25 checks a day
            # grows it gradually; raise this once the VM has room.
            - name: Discover Workday companies
              continue-on-error: true
              run: node index.js discover --source workday --verify-limit 25
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Discover Keka companies
              continue-on-error: true
              run: node index.js discover --source keka
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
