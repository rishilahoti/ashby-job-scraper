name: Deploy web

# Builds the web app into an arm64 image (the Oracle server that runs it is arm64), scans it,
# pushes it to GHCR, and tells the server to run it. Cloudflare sits in front of the server.
on:
  push:
    branches: [main]
    # The same inputs Vercel's ignoreCommand watches, plus this file and the image recipe.
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "src/config/rules.json"
      - "src/intelligence/**"
      - "src/normalize/**"
      - "src/utils/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read # checkout
      packages: write # push the image to GHCR
      security-events: write # upload the Trivy results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The database has no public port: DATABASE_URL points at 127.0.0.1:5432, which this forwards
      # through Cloudflare (db.whatrunsindia.com), where only the Access service token gets through.
      - name: Open the database tunnel
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          docker run -d --network host -e TUNNEL_SERVICE_TOKEN_ID -e TUNNEL_SERVICE_TOKEN_SECRET \
            cloudflare/cloudflared:2026.10.0 access tcp --hostname db.whatrunsindia.com --url 127.0.0.1:5432
          for _ in $(seq 1 20); do (: > /dev/tcp/127.0.0.1/5432) 2>/dev/null && exit 0; sleep 1; done
          echo "::error::the database tunnel never started listening"; exit 1

      # Host networking, so the prerender inside the build reaches the tunnel on the runner's 127.0.0.1.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first (no push) so the scan below gates the push.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          network: host
          allow: network.host
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload scan results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Push image
        run: docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: build
    # Skipped until the server is set up and its address is stored as a repository variable, and for
    # manual runs from any branch other than main (those still build and scan, but never deploy).
    if: vars.WEB_VM_HOST != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the default; this job checks nothing out
      packages: read # the GITHUB_TOKEN handed to deploy.sh only needs to pull the image
    steps:
      # The key can only run the server's deploy.sh (authorized_keys "command="), which takes the
      # image tag from the ssh command and a short-lived token for pulling it from stdin.
      - name: Deploy
        env:
          WEB_VM_SSH_KEY: ${{ secrets.WEB_VM_SSH_KEY }}
          WEB_VM_HOST: ${{ vars.WEB_VM_HOST }}
          WEB_VM_HOST_KEY: ${{ vars.WEB_VM_HOST_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEB_VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$WEB_VM_HOST" "$WEB_VM_HOST_KEY" > ~/.ssh/known_hosts
          # deploy.sh only reports success once the new image answers /api/health through Cloudflare,
          # and rolls back otherwise, so a green step here means the new version is live.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "ubuntu@$WEB_VM_HOST" "$GITHUB_SHA"

      # Cloudflare keeps job pages for a day and the feed for an hour, and every build renames its JS
      # files: without a purge, cached HTML could point at files the new image no longer has.
      # The token can only purge this zone's cache.
      - name: Purge the Cloudflare cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          [ -n "$CF_PURGE_TOKEN" ] || { echo "::warning::no CLOUDFLARE_PURGE_TOKEN secret; cache not purged"; exit 0; }
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/db4ee4cf3f2874b65a7ea8da743d24a9/purge_cache" \
            --data '{"hosts":["jobs.whatrunsindia.com"]}' -o /dev/null \
            || echo "::warning::Cloudflare purge failed; cached pages refresh on their own within a day"
