services:
  # The database runs on the web server (deploy/web/docker-compose.yml). This forwards db:5432 to it
  # through Cloudflare (db.whatrunsindia.com, Access service token), so DATABASE_URL below is unchanged.
  # The service token is CF_ACCESS_CLIENT_ID/SECRET in .env.
  db:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: access tcp --hostname db.whatrunsindia.com --url 0.0.0.0:5432
    environment:
      TUNNEL_SERVICE_TOKEN_ID: ${CF_ACCESS_CLIENT_ID:?}
      TUNNEL_SERVICE_TOKEN_SECRET: ${CF_ACCESS_CLIENT_SECRET:?}

  scraper:
    image: ghcr.io/rishilahoti/ashby-job-scraper-scraper:latest
    restart: unless-stopped
    # Not "healthy": cloudflared's image has no shell for a healthcheck. A scrape that can't reach
    # the database fails and is retried on the next run.
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 0 * * *}
      # Daily digest email after each scrape; skipped while these are unset.
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-rishilahoti99@gmail.com}
      # The digest's LinkedIn copy is written by Groq's free tier; templates while unset.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Posts the digest's LinkedIn posts 6 hours apart; off while unset.
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Polls GHCR every 5min; pulls + recreates only labeled containers (scraper),
  # so a new push to main auto-deploys without SSHing into the VM. db untouched.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.41"
